name: NotchApp
options:
  bundleIdPrefix: com.egor
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "748BMB94QZ"
targets:
  NotchApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/NotchApp
        excludes:
          - "MediaControl/**"
      - path: Sources/NotchApp/MediaControl
        buildPhase: resources
        type: folder
    info:
      path: Sources/NotchApp/Info.plist
      properties:
        CFBundleName: NotchApp
        CFBundleDisplayName: NotchApp
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSUIElement: true
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        NSAudioCaptureUsageDescription: "NotchApp измеряет громкость играющего звука, чтобы эквалайзер у выреза двигался в такт музыке. Звук не записывается и никуда не отправляется."
    entitlements:
      path: Sources/NotchApp/NotchApp.entitlements
      properties:
        com.apple.security.app-sandbox: false
